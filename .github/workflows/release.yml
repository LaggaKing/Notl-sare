name: Release (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.1.0-alpha.1)"
        required: false
        default: "v0.1.0-alpha.1"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Windows bundles
        run: npx tauri build

      - name: Stage ASCII-safe release assets and SHA256SUMS.txt
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "${{ inputs.tag }}".Trim()
            if (-not $tag) {
              $tag = "v0.1.0-alpha.1"
            }
          }

          $safeTag = ($tag -replace '[^A-Za-z0-9._-]', '-')
          $outDir = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "No .msi installer found under src-tauri/target/release/bundle/msi"
          }
          $msiDestName = "Notl-sare_${safeTag}_x64.msi"
          Copy-Item -Path $msi.FullName -Destination (Join-Path $outDir $msiDestName) -Force

          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $nsis) {
            throw "No -setup.exe installer found under src-tauri/target/release/bundle/nsis"
          }
          $nsisDestName = "Notl-sare_${safeTag}_x64-setup.exe"
          Copy-Item -Path $nsis.FullName -Destination (Join-Path $outDir $nsisDestName) -Force

          Push-Location $outDir
          $sums = @()
          foreach ($fileName in @($msiDestName, $nsisDestName)) {
            $hash = (Get-FileHash -Path $fileName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sums += "$hash  $fileName"
          }
          Set-Content -Path "SHA256SUMS.txt" -Value $sums -Encoding utf8NoBOM
          Pop-Location

          "tag=$safeTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create Draft Prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: Notl-sare ${{ steps.stage.outputs.tag }} (Windows Alpha)
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            release-artifacts/*.msi
            release-artifacts/*-setup.exe
            release-artifacts/SHA256SUMS.txt
