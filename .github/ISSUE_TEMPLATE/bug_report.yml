name: Bug Report
description: Report a bug or crash in Notläsare
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping test Notläsare! Please share as much detail as you can. (Do not attach copyrighted sheet music PDFs unless you own the rights or can reproduce the issue with a public-domain score.)

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which Notläsare version are you running?
      placeholder: "v0.1.0-alpha.1"
    validations:
      required: true

  - type: dropdown
    id: windows-version
    attributes:
      label: Windows Version
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What did you do right before the bug happened?
      placeholder: |
        1. Open a PDF score
        2. Enter annotation mode and ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happened instead? Include any error message shown in the app.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else helpful (e.g., rotated PDF, half-page split mode, touch/pen vs mouse, UI language).
